<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오프라인 - ttip</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .brand {
      font-size: 1.5rem;
      font-weight: 900;
      color: #f97316;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-block;
      background: #f97316;
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .btn:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <div class="brand">ttip</div>
    <h1>인터넷 연결이 끊겼어요</h1>
    <p>네트워크 연결을 확인하고<br>다시 시도해 주세요.</p>
    <button class="btn" onclick="window.location.reload()">다시 시도</button>
  </div>
</body>
</html>
